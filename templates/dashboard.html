<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaptal-Dashboard</title>
    
    <link rel="stylesheet" href="../static/CSS/dashboard.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="dashboard-container">
        <nav class="card sidebar">
            <div class="logo"></div>

            <ul class="menu">
                <li><i class='bx bxs-dashboard'></i></li>
                <li><i class='bx bx-transfer'></i></li>
                <li><i class='bx bx-trending-up'></i></li>
                <li><i class='bx bx-wallet'></i></li>
            </ul>

            <a href="/logout" class="logout-link" title="Cerrar sesión">
                <i class='bx bx-log-out'></i>
            </a>
        </nav>

        <main class="main-content">
            <section class="top-section">
                <div class="card chart-invest">
                    <h3>Grafico de rentabilidad de inversiones</h3>
                    <div class="chart-placeholder">Gráfico de Líneas Aquí</div>
                </div>
                
                <div class="wallets-buttons">
                    <button class="btn-wallet">Cartera 1</button>
                    <button class="btn-wallet btn-total">Total</button>
                </div>
            </section>

            <section class="bottom-section">
                <div class="transaction-buttons">
                    <button class="btn-transaction-ingreso" id="btnIngreso"> 
                        <i class='bx bx-plus'></i> Nuevo Ingreso
                    </button>
                    <button class="btn-transaction-gasto" id="btnGasto"> 
                        <i class='bx bx-minus'></i> Nuevo Gasto
                    </button>
                    <button class="btn-config" id="btnConfig"> 
                        <i class='bx bx-cog'></i> Ajustar Porcentajes
                    </button>
                </div>

                <div class="card chart-distribution">
                    <h3>Grafico de ingresos, gastos y distribucion mensual</h3>
                    <div class="chart-placeholder">Gráfico de Barras Aquí</div>
                </div>

                <div class="card chart-location">
                    <h3>Grafico de ubicacion del capital</h3>
                    <div class="chart-placeholder">Gráfico de Rosca Aquí</div>
                </div>
            </section>
        </main>
    </div>

    <div id="modalMovimiento" class="modal-overlay">
        <div class="modal-content card">
            <h3 id="modalTitulo">Nuevo Ingreso</h3>
            <form id="formMovimiento">
                <input type="hidden" id="tipo_movimiento" value="ingreso">
                
                <div class="form-group">
                    <label for="concepto">Concepto</label>
                    <input type="text" id="concepto" required placeholder="Ej: Nómina, Supermercado">
                </div>
                
                <div class="form-group">
                    <label for="cantidad">Cantidad (€)</label>
                    <input type="number" id="cantidad" step="0.01" required placeholder="0.00">
                </div>
                
                <div class="form-group" id="grupoCategoria">
                    <label for="categoria">Categoría</label>
                    <select id="categoria" name="categoria">
                        <option value="fijo">Gasto Fijo</option>
                        <option value="ocio">Ocio</option>
                        <option value="ahorro_inversion">Ahorro/Inversión</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>
                
                <div class="modal-actions">
                    <button type="submit" class="btn-guardar">Guardar Movimiento</button>
                    <button type="button" class="btn-cancelar" id="btnCancelarModal">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modalConfig" class="modal-overlay">
        <div class="modal-content card">
            <h3>Ajustar Presupuesto</h3>
            <p class="modal-subtitle">Distribuye el 100% de tus ingresos</p>
            
            <form id="formConfig">
                <div class="form-group">
                    <label for="pct_fijo">Gastos Fijos (%)</label>
                    <input type="number" id="pct_fijo" min="0" max="100" value="{{ pct_fijo }}" required>
                </div>
                <div class="form-group">
                    <label for="pct_ocio">Ocio (%)</label>
                    <input type="number" id="pct_ocio" min="0" max="100" value="{{ pct_ocio }}" required>
                </div>
                <div class="form-group">
                    <label for="pct_ahorro">Ahorro / Inversión (%)</label>
                    <input type="number" id="pct_ahorro" min="0" max="100" value="{{ pct_ahorro }}" required>
                </div>
                
                <div class="modal-actions">
                    <button type="submit" class="btn-guardar">Guardar Ajustes</button>
                    <button type="button" class="btn-cancelar" id="btnCancelarConfig">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../static/js/dashboard.js"></script>
</body>
</html>
